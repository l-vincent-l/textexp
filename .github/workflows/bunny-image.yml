name: Bunny image

# Builds the image for Bunny, with the database on Bunny Database
# (DATABASE_ADAPTER=hrana), and pushes it to ghcr.io, tagged with the commit
# and `latest`. Deploying it to the Magic Container is done by hand, on Bunny.
#
# Run on every push to main (a merged pull request), or by hand: Actions >
# Bunny image > Run workflow, or `gh workflow run bunny-image.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time, in order: `latest` ends up on the last commit.
concurrency:
  group: bunny-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DATABASE_ADAPTER=hrana
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
