name: Deploy to Bunny

# Deploys to Bunny: builds the image with the database on Bunny Database
# (DATABASE_ADAPTER=hrana), pushes it to ghcr.io, then points the Magic
# Container at it, which redeploys it.
#
# Run by hand: Actions > Deploy to Bunny > Run workflow, or
# `gh workflow run deploy-bunny.yml`. Needs the BUNNY_API_KEY repository
# secret (an API key of the Bunny account).
on:
  workflow_dispatch:

concurrency:
  group: deploy-bunny
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The Magic Containers application and its container.
  BUNNY_APP_ID: quo8xPZI3p0XxX1
  BUNNY_CONTAINER: textexp

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DATABASE_ADAPTER=hrana
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the Magic Container at the new image
        # BunnyWay/actions has no release of this action: pinned to a commit.
        uses: BunnyWay/actions/container-update-image@931a74b9c45ea9f9f01435fbbf1649830e67d3b3
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ env.BUNNY_APP_ID }}
          container: ${{ env.BUNNY_CONTAINER }}
          image_tag: ${{ github.sha }}
          image_digest: ${{ steps.build.outputs.digest }}
