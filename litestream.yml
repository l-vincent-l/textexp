# Litestream configuration of the Fly.io image (see the `fly` stage of the
# Dockerfile). The bucket and its credentials (BUCKET_NAME, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY) are the secrets set by `fly storage create`.
dbs:
  - path: ${DATABASE_PATH}
    replica:
      url: s3://${BUCKET_NAME}/textexp.db?endpoint=fly.storage.tigris.dev&region=auto
